name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated jasmine spec file paths to run instead of the full suite (empty = full suite)'
        required: false
        default: ''

jobs:
  Test:
    strategy:
      matrix:
        node_version: [14, 16]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin Registry To Release Date ⏳
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- ${{ inputs.test-filter }}
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        if: inputs.test-filter == ''
        run: npm run test:specs
      - name: Build 🗜️
        if: matrix.node_version == 14
        run: npm run build
      - name: Install npm 7.12.0 (packer used for the public tarball)
        if: matrix.node_version == 14
        run: npm i -g npm@7.12.0
      - name: Pack 📦
        if: matrix.node_version == 14
        run: npm pack
      - name: Upload Package Tarball 📦
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: marked-2.0.6
          path: marked-2.0.6.tgz
          if-no-files-found: error
